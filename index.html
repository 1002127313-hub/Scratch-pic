<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>כרטיס גירוד לימודי</title>
    <!-- שימוש ב-Tailwind CSS לעיצוב מהיר ומודרני -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Assistant:wght@400;700&display=swap');
        
        body {
            font-family: 'Assistant', sans-serif;
            background-color: #f3f4f6; /* רקע אפור בהיר */
        }
        
        .scratch-container {
            position: relative;
            width: 300px;
            height: 300px;
            user-select: none;
        }
        
        /* עיצוב התמונה והקנבס כך שישבו בדיוק אחד על השני */
        .scratch-container img, .scratch-container canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        
        .scratch-container img {
            object-fit: cover;
        }
        
        canvas {
            cursor: crosshair;
            /* מונע מהמסך להיגרר כשמגרדים בטלפון הנייד */
            touch-action: none; 
        }
        
        /* אנימציות למסך הניצחון */
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-2xl shadow-xl text-center max-w-md w-full relative overflow-hidden">
        <h1 class="text-3xl font-bold text-indigo-600 mb-2">כרטיס גירוד</h1>
        <p class="text-gray-600 mb-8 text-lg">גרד את המשטח האפור כדי לגלות את התמונה המסתתרת!</p>

        <!-- מסך הניצחון: מוסתר כברירת מחדל, יקפוץ כשנגלה את התמונה -->
        <div id="winScreen" class="hidden absolute inset-0 bg-white/95 backdrop-blur-sm z-20 flex-col items-center justify-center">
            <h2 class="text-3xl font-bold text-green-500 mb-2">מצוין!</h2>
            <p class="text-xl text-gray-700 mb-6">הקוד לעבור לחידה הבאה הוא:</p>
            <div class="text-8xl font-black text-indigo-600 drop-shadow-lg pop-in">666</div>
            <button onclick="document.getElementById('winScreen').classList.add('hidden')" class="mt-10 px-6 py-2 bg-indigo-100 text-indigo-700 rounded-full hover:bg-indigo-200 transition font-bold">סגור וחזור לתמונה</button>
        </div>

        <div class="scratch-container mx-auto">
            <!-- 
                התמונה שונתה ל- pic.png בהתאם לבקשתך
            -->
            <img src="pic.png" alt="תמונה מוסתרת" id="hiddenImage" crossorigin="anonymous">
            
            <!-- שכבת הגירוד -->
            <canvas id="scratchCanvas" width="300" height="300"></canvas>
        </div>
        
        <!-- קובץ שמע - תרועת ניצחון -->
        <audio id="victorySound" src="https://assets.mixkit.co/active_storage/sfx/2013/2013-preview.mp3" preload="auto"></audio>
        
        <div class="mt-8 p-4 bg-yellow-50 text-yellow-800 text-sm rounded-lg border border-yellow-200 text-right">
            <strong>הנחיה למורה:</strong><br>
            כדי שהתמונה שלך תופיע, שמור את התמונה באותה תיקייה של קובץ זה בגיטהאב, ושנה בשורת הקוד (מספר 46) את כתובת התמונה לשם הקובץ שלך.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let isRevealed = false; // האם התמונה כבר נחשפה במלואה?

        // פונקציה להכנת הקנבס - צובעת באפור וכותבת טקסט
        function initCanvas() {
            // צבע רקע אפור
            ctx.fillStyle = '#9ca3af'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // הוספת טקסט למרכז
            ctx.fillStyle = '#4b5563'; 
            ctx.font = 'bold 36px Assistant, Arial, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('גרד כאן!', canvas.width / 2, canvas.height / 2);
        }

        // קריאה לפונקציית ההתחלה
        initCanvas();

        // פונקציה שמחשבת את המיקום המדויק של העכבר או האצבע
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // חישוב יחס הגודל במקרה שהמסך קטן יותר מהקנבס המקורי
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX = e.clientX;
            let clientY = e.clientY;

            // זיהוי מגע (טלפונים ניידים)
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // פונקציית הגירוד עצמה
        function scratch(e) {
            if (!isDrawing || isRevealed) return;
            e.preventDefault(); // מונע התנהגות ברירת מחדל כמו גלילה

            const { x, y } = getCoordinates(e);

            // הפעולה שהופכת את הציור למחיקה של הרקע
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            // מצייר עיגול ש"מוחק" ברדיוס של 25 פיקסלים
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        // פונקציה שבודקת האם המשתמש גירד מספיק כדי לחשוף את התמונה
        function checkReveal() {
            if (isRevealed) return;
            
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const pixels = imageData.data;
            let transparentPixels = 0;
            
            // עוברים על כל הפיקסלים (בקפיצות של 4 בגלל RGBA)
            // בודקים את ערוץ השקיפות (Alpha) - מיקום אחרון בכל רביעייה
            for (let i = 3; i < pixels.length; i += 4) {
                if (pixels[i] < 128) {
                    transparentPixels++;
                }
            }
            
            const totalPixels = pixels.length / 4;
            const percentage = (transparentPixels / totalPixels) * 100;
            
            // ברגע שיותר מ-50% מהכרטיס גורד - חושפים הכל!
            if (percentage > 50) {
                isRevealed = true;
                
                // מוחק באופן חלק את שאריות האפור
                canvas.style.transition = 'opacity 0.8s ease-out';
                canvas.style.opacity = '0';
                
                // מפעיל את צליל הניצחון
                const victorySound = document.getElementById('victorySound');
                victorySound.play().catch(err => console.log("הדפדפן חסם את הצליל", err));
                
                // מציג את מסך הקוד המנצח
                setTimeout(() => {
                    canvas.style.display = 'none'; // מעלים סופית את הקנבס
                    const winScreen = document.getElementById('winScreen');
                    winScreen.classList.remove('hidden');
                    winScreen.classList.add('flex');
                }, 800);
            }
        }

        // --- אירועי עכבר (למחשב) ---
        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            scratch(e);
        });
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('mouseup', () => {
            isDrawing = false;
            checkReveal(); // בדיקה בכל פעם שמשחררים את העכבר
        });
        canvas.addEventListener('mouseleave', () => {
            isDrawing = false;
            checkReveal();
        });

        // --- אירועי מגע (לטלפונים וטאבלטים) ---
        canvas.addEventListener('touchstart', (e) => {
            isDrawing = true;
            scratch(e);
        }, { passive: false });
        canvas.addEventListener('touchmove', scratch, { passive: false });
        canvas.addEventListener('touchend', () => {
            isDrawing = false;
            checkReveal(); // בדיקה בכל פעם שמשחררים את האצבע
        });
        canvas.addEventListener('touchcancel', () => {
            isDrawing = false;
            checkReveal();
        });
    </script>
</body>
</html>
